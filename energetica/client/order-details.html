<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Details - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/order-details.css">
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <a href="index.html"><h1>Energetica</h1></a>
      </div>
      <div class="auth-buttons">
        <!-- Auth buttons will be dynamically inserted here -->
      </div>
    </div>

    <div class="order-details-container">
      <div class="lightning">
        <div class="bolt"></div>
        <div class="bolt"></div>
      </div>
      
      <h2 class="cyber-title">Order Details</h2>
      
      <div class="order-details-card">
        <div class="order-header">
          <div class="order-info">
            <h3 id="order-id">Order #</h3>
            <p id="order-date">Date: </p>
            <p id="order-status">Status: </p>
          </div>
          <div class="order-summary">
            <p>Total Items: <span id="total-items">0</span></p>
            <p>Total Amount: <span id="total-amount">$0.00</span></p>
          </div>
        </div>

        <div class="order-items">
          <h4>Items</h4>
          <div id="order-items-list">
            <!-- Order items will be loaded here -->
          </div>
        </div>

        <div class="order-actions">
          <button class="cyber-button" onclick="window.location.href='profile.html'">Back to Profile</button>
          <button class="cyber-button secondary" onclick="printOrder()">Print Order</button>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2024 Energetica. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/order-details.js"></script>
  </body>
</html>
