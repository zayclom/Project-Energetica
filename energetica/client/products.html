<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <a href="index.html"><h1>Energetica</h1></a>
        </div>
        <div class="header-right">
            <div class="cart-icon">
                <a href="cart.html">
                    <span class="cart-icon-symbol">🛒</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
            <div class="auth-buttons">
                <!-- Auth buttons will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <div class="products-container">
        <div class="lightning">
            <div class="bolt"></div>
            <div class="bolt"></div>
        </div>
        
        <h2 class="cyber-title">Power Arsenal</h2>
        
        <div class="search-filter-container">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products..." class="cyber-input">
                <button class="cyber-button small" onclick="applyFilters()">Search</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label>Sort By:</label>
                    <select id="sortBy" class="cyber-select" onchange="applyFilters()">
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="price-asc">Price (Low to High)</option>
                        <option value="price-desc">Price (High to Low)</option>
                        <option value="caffeine-asc">Caffeine (Low to High)</option>
                        <option value="caffeine-desc">Caffeine (High to Low)</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Product Type:</label>
                    <select id="productType" class="cyber-select" onchange="applyFilters()">
                        <option value="all">All Types</option>
                        <option value="drink">Drinks</option>
                        <option value="powder">Powders</option>
                        <option value="supplement">Supplements</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label>Price Range:</label>
                    <div class="price-range">
                        <input type="number" id="minPrice" placeholder="Min" class="cyber-input" onchange="applyFilters()">
                        <span>to</span>
                        <input type="number" id="maxPrice" placeholder="Max" class="cyber-input" onchange="applyFilters()">
                    </div>
                </div>
                
                <div class="filter-group">
                    <label>Caffeine Range (mg):</label>
                    <div class="caffeine-range">
                        <input type="number" id="minCaffeine" placeholder="Min" class="cyber-input" onchange="applyFilters()">
                        <span>to</span>
                        <input type="number" id="maxCaffeine" placeholder="Max" class="cyber-input" onchange="applyFilters()">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>

        <a href="index.html" class="cyber-button back-button">Back</a>
    </div>

    <footer>
        <p>&copy; 2024 Energetica. All rights reserved.</p>
    </footer>

    <!-- Load auth.js first to ensure auth is initialized before other scripts -->
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // Wait for auth to be initialized before loading products
        let productsLoaded = false;
        
        async function loadProductsOnce() {
            if (!productsLoaded) {
                productsLoaded = true;
                try {
                    // First try to load products immediately
                    await loadProducts();
                    
                    // Then check auth status if needed
                    const storedUser = localStorage.getItem('user');
                    if (!storedUser) {
                        if (window.checkAuthStatus) {
                            await window.checkAuthStatus();
                        }
                    }
                } catch (error) {
                    console.error('Error loading products:', error);
                    productsLoaded = false; // Reset flag on error
                }
            }
        }

        // Load products when page is ready
        if (document.readyState === 'complete') {
            loadProductsOnce();
        } else {
            document.addEventListener('DOMContentLoaded', loadProductsOnce);
        }

        let allProducts = []; // Store all products for filtering
        
        async function loadProducts() {
            try {
                console.log('Attempting to fetch products from server...');
                const response = await fetch('http://localhost:5001/api/products');
                console.log('Server response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const products = await response.json();
                console.log('Products received:', products);
                
                if (!products || products.length === 0) {
                    console.log('No products received from server');
                    return;
                }
                
                allProducts = products; // Store all products
                applyFilters(); // Apply initial filters
            } catch (error) {
                console.error('Error loading products:', error);
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = `
                    <div class="error-message">
                        <p>Error loading products. Please try again later.</p>
                        <p>Error details: ${error.message}</p>
                    </div>
                `;
            }
        }

        function applyFilters() {
            let filteredProducts = [...allProducts];
            
            // Apply search text filter
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            if (searchText) {
                filteredProducts = filteredProducts.filter(product => 
                    product.name.toLowerCase().includes(searchText) ||
                    product.description.toLowerCase().includes(searchText)
                );
            }
            
            // Apply product type filter
            const productType = document.getElementById('productType').value;
            if (productType !== 'all') {
                filteredProducts = filteredProducts.filter(product => 
                    product.type === productType
                );
            }
            
            // Apply price range filter
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            filteredProducts = filteredProducts.filter(product => 
                product.price >= minPrice && product.price <= maxPrice
            );
            
            // Apply caffeine range filter
            const minCaffeine = parseInt(document.getElementById('minCaffeine').value) || 0;
            const maxCaffeine = parseInt(document.getElementById('maxCaffeine').value) || Infinity;
            filteredProducts = filteredProducts.filter(product => 
                product.caffeine >= minCaffeine && product.caffeine <= maxCaffeine
            );
            
            // Apply sorting
            const sortBy = document.getElementById('sortBy').value;
            switch (sortBy) {
                case 'name-asc':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'price-asc':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-desc':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                case 'caffeine-asc':
                    filteredProducts.sort((a, b) => a.caffeine - b.caffeine);
                    break;
                case 'caffeine-desc':
                    filteredProducts.sort((a, b) => b.caffeine - a.caffeine);
                    break;
            }
            
            displayProducts(filteredProducts);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="no-products">No products available</p>';
                return;
            }

            console.log('Displaying products:', products);
            products.forEach(product => {
                const energyPercentage = (product.caffeine / 200) * 100;
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.imageUrl}" alt="${product.name}" 
                             onerror="this.onerror=null; this.src='images/placeholder.png';">
                        <div class="energy-meter" style="--energy: ${energyPercentage}%"></div>
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="description">${product.description}</p>
                        <div class="product-stats">
                            <span>⚡ ${product.caffeine}mg</span>
                            <span>📊 ${product.servingSize}</span>
                        </div>
                        <div class="price-action">
                            <div class="price-container">
                                <span class="price">$${product.price.toFixed(2)}</span>
                                ${product.preDiscountedPrice ? `<span class="pre-discounted-price">$${product.preDiscountedPrice.toFixed(2)}</span>` : ''}
                            </div>
                            <button class="cyber-button small add-to-cart" data-product='${JSON.stringify(product)}'>Add to Cart</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Add event listeners for Add to Cart buttons
            document.querySelectorAll('.add-to-cart').forEach(button => {
                button.addEventListener('click', (e) => {
                    const product = JSON.parse(e.target.dataset.product);
                    addToCart(product);
                });
            });
        }

        // Add to cart function 
        function addToCart(product) {
            // Get existing cart from localStorage
            let cart = [];
            const savedCart = localStorage.getItem('energeticaCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            
            // Check if product already exists in cart
            const existingProduct = cart.find(item => item._id === product._id);
            
            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }
            
            // Save updated cart
            localStorage.setItem('energeticaCart', JSON.stringify(cart));
            
            // Show success message
            const successMessage = document.createElement('div');
            successMessage.className = 'add-cart-success';
            successMessage.textContent = `${product.name} added to cart!`;
            document.body.appendChild(successMessage);
            
            // Remove message after 2 seconds
            setTimeout(() => {
                successMessage.classList.add('fade-out');
                setTimeout(() => {
                    document.body.removeChild(successMessage);
                }, 500);
            }, 2000);
        }

        function updateCartCount() {
            const cartCountElement = document.querySelector('.cart-count');
            if (!cartCountElement) return;
            
            const cart = JSON.parse(localStorage.getItem('energeticaCart') || '[]');
            const itemCount = cart.reduce((total, item) => total + item.quantity, 0);
            
            cartCountElement.textContent = itemCount;
        }

        // Call this on page load
        document.addEventListener('DOMContentLoaded', updateCartCount);
    </script>
</body>
</html>
