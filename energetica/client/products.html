<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
    <div class="header">
        <div class="logo">
            <a href="index.html"><h1>Energetica</h1></a>
        </div>
        <div class="header-right">
            <div class="cart-icon">
                <a href="cart.html">
                    <span class="cart-icon-symbol">🛒</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
            <div class="auth-buttons">
                <!-- Auth buttons will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <div class="products-container">
        <div class="lightning">
            <div class="bolt"></div>
            <div class="bolt"></div>
        </div>
        
        <h2 class="cyber-title">Power Arsenal</h2>
        
        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>

        <a href="index.html" class="cyber-button back-button">Back</a>
    </div>

    <footer>
        <p>&copy; 2024 Energetica. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatus();
            loadProducts();
        });

        async function loadProducts() {
            try {
                const response = await fetch('http://localhost:5001/api/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();
                displayProducts(products);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const energyPercentage = (product.caffeine / 200) * 100;
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image">
                        <img src="${product.imageUrl}" alt="${product.name}" 
                             onerror="this.onerror=null; this.src='images/placeholder.png';">
                        <div class="energy-meter" style="--energy: ${energyPercentage}%"></div>
                    </div>
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="description">${product.description}</p>
                        <div class="product-stats">
                            <span>⚡ ${product.caffeine}mg</span>
                            <span>📊 ${product.servingSize}</span>
                        </div>
                        <div class="price-action">
                            <span class="price">$${product.price.toFixed(2)}</span>
                            <button class="cyber-button small add-to-cart" data-product='${JSON.stringify(product)}'>Add to Cart</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // Add event listeners for Add to Cart buttons
            document.querySelectorAll('.add-to-cart').forEach(button => {
                button.addEventListener('click', (e) => {
                    const product = JSON.parse(e.target.dataset.product);
                    addToCart(product);
                });
            });
        }

        // Add to cart function 
        function addToCart(product) {
            // Get existing cart from localStorage
            let cart = [];
            const savedCart = localStorage.getItem('energeticaCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            
            // Check if product already exists in cart
            const existingProduct = cart.find(item => item._id === product._id);
            
            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }
            
            // Save updated cart
            localStorage.setItem('energeticaCart', JSON.stringify(cart));
            
            // Show success message
            const successMessage = document.createElement('div');
            successMessage.className = 'add-cart-success';
            successMessage.textContent = `${product.name} added to cart!`;
            document.body.appendChild(successMessage);
            
            // Remove message after 2 seconds
            setTimeout(() => {
                successMessage.classList.add('fade-out');
                setTimeout(() => {
                    document.body.removeChild(successMessage);
                }, 500);
            }, 2000);
        }

        function updateCartCount() {
            const cartCountElement = document.querySelector('.cart-count');
            if (!cartCountElement) return;
            
            const cart = JSON.parse(localStorage.getItem('energeticaCart') || '[]');
            const itemCount = cart.reduce((total, item) => total + item.quantity, 0);
            
            cartCountElement.textContent = itemCount;
        }

        // Call this on page load
        document.addEventListener('DOMContentLoaded', updateCartCount);
    </script>
</body>
</html>
