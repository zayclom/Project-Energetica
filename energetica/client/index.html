<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Energetica</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        overflow: hidden;
      }

      .splash-container {
        position: fixed;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      }

      .title {
        font-family: 'Arial Black', sans-serif;
        font-size: 5rem;
        color: #fff;
        text-shadow: 0 0 10px #00f, 0 0 20px #00f, 0 0 30px #00f;
        animation: glow 2s ease-in-out infinite alternate;
        position: relative;
        letter-spacing: 0.2em;
      }

      /* Electric sparks */
      .title::before,
      .title::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #00f, transparent);
        animation: spark 1.5s linear infinite;
      }

      .title::before {
        top: -20px;
      }

      .title::after {
        bottom: -20px;
      }

      /* Lightning bolts */
      .lightning {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .bolt {
        position: absolute;
        width: 2px;
        height: 20px;
        background: #00f;
        animation: lightning 1s linear infinite;
        filter: blur(1px);
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 10px #00f, 0 0 20px #00f, 0 0 30px #00f;
        }
        to {
          text-shadow: 0 0 20px #00f, 0 0 30px #00f, 0 0 40px #00f;
        }
      }

      @keyframes spark {
        0% {
          transform: scaleX(0);
          opacity: 0;
        }
        50% {
          transform: scaleX(1);
          opacity: 1;
        }
        100% {
          transform: scaleX(0);
          opacity: 0;
        }
      }

      @keyframes lightning {
        0% {
          transform: translateY(-100%) rotate(0deg);
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          transform: translateY(100%) rotate(0deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="lightning">
        <div class="bolt" style="left: 20%; animation-delay: 0.2s;"></div>
        <div class="bolt" style="left: 40%; animation-delay: 0.5s;"></div>
        <div class="bolt" style="left: 60%; animation-delay: 0.8s;"></div>
        <div class="bolt" style="left: 80%; animation-delay: 1.1s;"></div>
      </div>
      <h1 class="title">ENERGETICA</h1>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Dynamically create more lightning bolts
      function createLightning() {
        const lightning = document.querySelector('.lightning');
        const bolt = document.createElement('div');
        bolt.className = 'bolt';
        bolt.style.left = Math.random() * 100 + '%';
        bolt.style.animationDelay = Math.random() + 's';
        lightning.appendChild(bolt);
        
        // Remove bolt after animation
        setTimeout(() => {
          bolt.remove();
        }, 1000);
      }
      
      // Create new lightning bolts periodically
      setInterval(createLightning, 500);
    </script>
  </body>
</html>
