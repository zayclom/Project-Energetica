<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/auth.css">
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <h1>Energetica</h1>
      </div>
      <div class="auth-buttons">
        <!-- Auth buttons will be dynamically inserted here -->
      </div>
    </div>

    <div class="auth-container">
      <div class="auth-box">
        <h2 class="cyber-title">Register</h2>
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required class="cyber-input" minlength="3">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="cyber-input" pattern="[^@\s]+@[^@\s]+\.[^@\s]+">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required class="cyber-input" minlength="6">
          </div>
          <div id="errorMessage" class="error-message"></div>
          <button type="submit" class="cyber-button" id="submitButton">Register</button>
        </form>
        <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
      async function handleRegister(event) {
        event.preventDefault();
        const errorMessage = document.getElementById('errorMessage');
        const submitButton = document.getElementById('submitButton');
        
        try {
          submitButton.disabled = true;
          submitButton.textContent = 'Registering...';
          errorMessage.textContent = '';
          
          const username = document.getElementById('username').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;

          console.log('Preparing registration request for:', { username, email });
          
          const API_URL = 'http://localhost:5001';
          
          // First, check if the server is available with more detailed error handling
          try {
            console.log('Checking server availability...');
            const healthCheck = await fetch(`${API_URL}/api/auth/check`, {
              method: 'GET',
              credentials: 'include',
              headers: {
                'Accept': 'application/json',
                'Origin': window.location.origin
              }
            });
            
            console.log('Server health check status:', healthCheck.status);
            const healthData = await healthCheck.json();
            console.log('Server health check response:', healthData);
            
          } catch (error) {
            console.error('Server health check failed:', error);
            console.log('Current origin:', window.location.origin);
            throw new Error(`Server is not available at ${API_URL}. Please ensure both servers are running:\n1. Frontend (npm run dev) - Port 5173\n2. Backend (node app.js) - Port 5001`);
          }

          // Proceed with registration
          console.log('Sending registration request...');
          const response = await fetch(`${API_URL}/api/auth/register`, {
            method: 'POST',
            credentials: 'include',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'Origin': window.location.origin
            },
            body: JSON.stringify({ username, email, password })
          });

          console.log('Registration response status:', response.status);
          
          const data = await response.json();
          console.log('Registration response data:', data);

          if (response.ok) {
            console.log('Registration successful');
            currentUser = data.user;
            updateUIForLoggedInUser();
            window.location.href = 'index.html';
          } else {
            console.error('Registration failed:', data);
            errorMessage.textContent = data.message || 'Registration failed. Please check your input and try again.';
          }
        } catch (error) {
          console.error('Registration error:', error);
          errorMessage.textContent = error.message || 'Network error or server unavailable. Please try again later.';
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Register';
        }
      }
    </script>
  </body>
</html>
