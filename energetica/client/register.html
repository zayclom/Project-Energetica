<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/forms.css">
  </head>
  <body>
    <div class="splash-container">
      <div class="lightning">
        <div class="bolt" style="left: 20%; animation-delay: 0.2s;"></div>
        <div class="bolt" style="left: 80%; animation-delay: 0.5s;"></div>
      </div>
      <div class="form-container">
        <h2 class="form-title">Register</h2>
        <form class="cyber-form" id="registerForm">
          <div class="form-group">
            <input type="text" id="username" required>
            <label for="username">Username</label>
            <div class="cyber-line"></div>
          </div>
          <div class="form-group">
            <input type="email" id="email" required>
            <label for="email">Email</label>
            <div class="cyber-line"></div>
          </div>
          <div class="form-group">
            <input type="password" id="password" required>
            <label for="password">Password</label>
            <div class="cyber-line"></div>
          </div>
          <div class="form-group">
            <input type="password" id="confirmPassword" required>
            <label for="confirmPassword">Confirm Password</label>
            <div class="cyber-line"></div>
          </div>
          <button type="submit" class="cyber-button">Create Account</button>
          <button type="button" class="cyber-button secondary" onclick="window.location.href='index.html'">Back to Home</button>
        </form>
      </div>
    </div>
    <div class="footer">
      © 2024 Team Energetica™ | All Rights Reserved | Premium Energy Solutions
    </div>
    <script src="js/effects.js"></script>
  </body>
</html>
