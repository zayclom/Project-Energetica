<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Energetica</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/title.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/auth.css">
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <h1>Energetica</h1>
      </div>
      <div class="auth-buttons">
        <!-- Auth buttons will be dynamically inserted here -->
      </div>
    </div>

    <div class="auth-container">
      <div class="auth-box">
        <h2 class="cyber-title">Login</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required class="cyber-input">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required class="cyber-input">
          </div>
          <div id="errorMessage" class="error-message"></div>
          <button type="submit" class="cyber-button">Login</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
      async function handleLogin(event) {
        event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        try {
          const result = await login(email, password);
          if (result && result.error) {
            errorMessage.textContent = result.error;
          }
        } catch (error) {
          errorMessage.textContent = 'Login failed. Please try again.';
        }
      }
    </script>
  </body>
</html>
